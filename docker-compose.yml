services:
  # Firestore Emulator (desenvolvimento local)
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: firestore-emulator
    ports:
      - "8080:8080"  # Firestore emulator
      - "4000:4000"  # Firestore UI
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    environment:
      - FIRESTORE_PROJECT_ID=stock-prediction-local
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API (Flask + LSTM)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOWNLOAD_ARTIFACTS: "false"  # Dev mode - usa artifacts local
    container_name: stock-api-backend
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5001
      - PYTHONUNBUFFERED=1
      - GOOGLE_CLOUD_PROJECT=stock-prediction-local
      - FIRESTORE_EMULATOR_HOST=firestore:8080
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-api-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  node_modules:
