# Google Cloud Build configuration for Stock Prediction LSTM API
# This file defines the build steps for deploying to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-prediction-api:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-prediction-api:latest'
      - '--build-arg'
      - 'GITHUB_REPO=${_GITHUB_REPO}'
      - '--build-arg'
      - 'DOWNLOAD_ARTIFACTS=true'
      - '.'
    timeout: '1200s'  # 20 minutes for PyTorch download

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-prediction-api:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-prediction-api:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'stock-prediction-api'
      - '--image=gcr.io/$PROJECT_ID/stock-prediction-api:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300s'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--port=5001'
      - '--set-env-vars=PYTHONUNBUFFERED=1,FLASK_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,RATE_LIMIT_ENABLED=true,RATE_LIMIT_STORAGE_URI=memory://,RATE_LIMIT_STRATEGY=fixed-window'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/stock-prediction-api:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/stock-prediction-api:latest'

# Build timeout (30 minutes total)
timeout: '1800s'

# Substitutions (can be overridden from command line)
substitutions:
  _GITHUB_REPO: 'adriannylelis/stock-prediction-lstm-api'

# Options
options:
  machineType: 'E2_HIGHCPU_8'  # Faster build with more CPU
  logging: CLOUD_LOGGING_ONLY
