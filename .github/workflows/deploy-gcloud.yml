name: 🌐 Deploy to Google Cloud (Full Stack)

on:
  # Trigger após treino bem-sucedido
  workflow_run:
    workflows: ["🤖 Train Model Weekly"]
    types:
      - completed
  
  # Deploy manual
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend API'
        required: false
        default: 'true'
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: false
        default: 'true'
        type: boolean
  
  # Deploy em push na master
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'Dockerfile'
      - 'frontend/Dockerfile'
      - '.github/workflows/deploy-gcloud.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  BACKEND_SERVICE: stock-api-backend
  FRONTEND_SERVICE: stock-api-frontend

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    
    steps:
      # ==================== SETUP ====================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      # ==================== GET ARTIFACTS ====================
      - name: 📦 Get latest model artifacts
        run: |
          echo "🔍 Fetching latest release..."
          
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          RELEASE_TAG=$(echo $LATEST_RELEASE | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo $LATEST_RELEASE | jq -r '.assets[0].browser_download_url')
          
          echo "📌 Latest release: $RELEASE_TAG"
          echo "📥 Download URL: $DOWNLOAD_URL"
          
          # Validate download URL
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ No assets found in the latest release '$RELEASE_TAG'."
            echo "⚠️ Please ensure a release with model artifacts exists."
            echo "Skipping artifact download - deployment will continue without latest artifacts."
            mkdir -p artifacts
            exit 0
          fi
          
          # Download artifacts
          curl -L -o artifacts.zip "$DOWNLOAD_URL"
          
          # Unzip
          mkdir -p artifacts
          unzip artifacts.zip -d artifacts/
          
          echo "✅ Artifacts downloaded successfully"
          ls -lah artifacts/
      
      # ==================== BUILD BACKEND ====================
      - name: 🏗️ Build Backend Docker Image
        run: |
          echo "🐳 Building backend image..."
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:latest \
            --timeout=20m \
            .
      
      # ==================== DEPLOY BACKEND ====================
      - name: 🚀 Deploy Backend to Cloud Run
        run: |
          echo "🚀 Deploying backend to Cloud Run..."
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars "FLASK_ENV=production,MODEL_TICKER=PETR4.SA,PYTHONUNBUFFERED=1" \
            --port 5001
          
          # Get service URL
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          
          echo "✅ Backend deployed successfully!"
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "🌐 Backend URL: $BACKEND_URL"
      
      # ==================== HEALTH CHECK ====================
      - name: 🏥 Backend Health Check
        run: |
          echo "⏳ Waiting 30s for backend to be ready..."
          sleep 30
          
          echo "🔍 Checking health at: ${{ env.BACKEND_URL }}/health"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.BACKEND_URL }}/health" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is healthy!"
          else
            echo "❌ Health check failed! Response code: $RESPONSE"
            exit 1
          fi
      
      - name: 💾 Save Backend URL
        run: |
          echo "${{ env.BACKEND_URL }}" > backend_url.txt
      
      - name: 📤 Upload Backend URL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-url
          path: backend_url.txt
          retention-days: 1

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    
    steps:
      # ==================== SETUP ====================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      # ==================== GET BACKEND URL ====================
      - name: 📥 Download Backend URL
        uses: actions/download-artifact@v4
        with:
          name: backend-url
      
      - name: 🔗 Set Backend URL
        run: |
          BACKEND_URL=$(cat backend_url.txt)
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "🌐 Backend URL: $BACKEND_URL"
      
      # ==================== UPDATE FRONTEND CONFIG ====================
      - name: ⚙️ Update Frontend API URL
        run: |
          cd frontend
          
          # Update nginx.conf with backend URL
          sed -i.bak "s|proxy_pass http://backend:5001;|proxy_pass ${{ env.BACKEND_URL }};|g" nginx.conf
          
          # Create .env for build
          echo "VITE_API_URL=${{ env.BACKEND_URL }}" > .env.production
          
          echo "✅ Frontend configured with backend URL"
      
      # ==================== BUILD FRONTEND ====================
      - name: 🏗️ Build Frontend Docker Image
        run: |
          echo "🐳 Building frontend image..."
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:latest \
            --timeout=15m \
            ./frontend
      
      # ==================== DEPLOY FRONTEND ====================
      - name: 🚀 Deploy Frontend to Cloud Run
        run: |
          echo "🚀 Deploying frontend to Cloud Run..."
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --port 80
          
          # Get service URL
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          
          echo "✅ Frontend deployed successfully!"
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "🌐 Frontend URL: $FRONTEND_URL"
      
      # ==================== SMOKE TEST ====================
      - name: 🧪 Frontend Smoke Test
        run: |
          echo "⏳ Waiting 20s for frontend to be ready..."
          sleep 20
          
          echo "🔍 Testing frontend at: ${{ env.FRONTEND_URL }}"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.FRONTEND_URL }}" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Frontend is accessible!"
          else
            echo "❌ Frontend test failed! Response code: $RESPONSE"
            exit 1
          fi
      
      # ==================== SUMMARY ====================
      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "# 🌐 Full Stack Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Deployed Services" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎨 Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ env.FRONTEND_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Backend API" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.BACKEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** ${{ env.BACKEND_URL }}/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ env.BACKEND_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Quick Tests" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Frontend" >> $GITHUB_STEP_SUMMARY
          echo "curl ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Backend Health" >> $GITHUB_STEP_SUMMARY
          echo "curl ${{ env.BACKEND_URL }}/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Prediction" >> $GITHUB_STEP_SUMMARY
          echo 'curl -X POST ${{ env.BACKEND_URL }}/predict \' >> $GITHUB_STEP_SUMMARY
          echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
          echo '  -d '"'"'{"ticker": "PETR4.SA", "periods": 7}'"'"'' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
