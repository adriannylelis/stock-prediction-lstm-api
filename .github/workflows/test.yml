name: 🧪 Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  FIRESTORE_PROJECT_ID: stock-prediction-test

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: 🧪 Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=src --cov-report=term-missing
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-unit

  integration-tests:
    name: Integration Tests (Firestore)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2.0"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: 🔥 Start Firestore Emulator
        run: |
          # Instalar gcloud emulators components
          curl https://sdk.cloud.google.com | bash > /dev/null
          exec -l $SHELL
          gcloud components install cloud-firestore-emulator --quiet
          
          # Iniciar emulador em background
          gcloud emulators firestore start --host-port=0.0.0.0:8080 &
          
          # Aguardar inicialização
          sleep 10
          
          # Configurar variáveis
          echo "FIRESTORE_EMULATOR_HOST=localhost:8080" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=${{ env.FIRESTORE_PROJECT_ID }}" >> $GITHUB_ENV
          
          echo "✅ Firestore emulator configured"
          echo "Host: localhost:8080"
          echo "Project: ${{ env.FIRESTORE_PROJECT_ID }}"
      
      - name: 🧪 Run integration tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GOOGLE_CLOUD_PROJECT: ${{ env.FIRESTORE_PROJECT_ID }}
          RATE_LIMIT_ENABLED: false  # Desabilitar rate limiting nos testes
        run: |
          pytest tests/integration/test_firestore_service.py -v --tb=short

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some tests failed. Please review the logs above.**" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: ❌ Fail if any test failed
        if: |
          needs.unit-tests.result != 'success' ||
          needs.integration-tests.result != 'success'
        run: exit 1
